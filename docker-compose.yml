services:

  postgres:
    image: postgres:17
    container_name: skv-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - skv


  directus:
    image: directus/directus:12.2
    container_name: skv-directus
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SECRET: ${DIRECTUS_SECRET}

      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}

      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      WEBSOCKETS_ENABLED: "true"

    volumes:
      - ./data/directus/uploads:/directus/uploads
      - ./data/directus/extensions:/directus/extensions

    ports:
      - "8055:8055"

    networks:
      - skv


  astro-build:
    image: node:22-bookworm-slim

    working_dir: /app

    profiles:
      - build

    depends_on:
      - directus

    environment:
      SITE: ${SITE}
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_STRICT: "true"
      PUBLIC_CONTACT_ENDPOINT: ${PUBLIC_CONTACT_ENDPOINT:-}

    volumes:
      - ./web:/app
      - astro_node_modules:/app/node_modules

    command:
      - sh
      - -c
      - |
        npm ci
        npm run build

    networks:
      - skv


  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile

    container_name: skv-web
    restart: unless-stopped

    ports:
      - "4321:80"

    networks:
      - skv


volumes:
  postgres_data:
  astro_node_modules:


networks:
  skv: