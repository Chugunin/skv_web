services:

  postgres:
    image: postgres:17
    container_name: skv-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - skv


  directus:
    image: directus/directus:12.2
    container_name: skv-directus
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SECRET: ${DIRECTUS_SECRET}

      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}

      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      WEBSOCKETS_ENABLED: "true"

    volumes:
      - ./data/directus/uploads:/directus/uploads
      - ./data/directus/extensions:/directus/extensions
      - ./directus/schema:/directus/schema

    ports:
      - "8055:8055"

    networks:
      - skv


  astro-build:
    image: node:22-bookworm-slim

    working_dir: /app

    profiles:
      - build

    depends_on:
      - directus

    environment:
      SITE: ${SITE}
      DIRECTUS_URL: http://directus:8055
      PUBLIC_DIRECTUS_URL: ${PUBLIC_DIRECTUS_URL}
      DIRECTUS_STRICT: "true"
      PUBLIC_CONTACT_ENDPOINT: ${PUBLIC_CONTACT_ENDPOINT:-}

      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"

    volumes:
      - ./web:/app
      - astro_node_modules:/app/node_modules
      - astro_npm_cache:/root/.npm

    command:
      - sh
      - -c
      - |
        set -e

        echo "=== Checking dependencies ==="

        CURRENT_HASH="$$(cat package.json package-lock.json | sha256sum | awk '{print $$1}')"
        CACHED_HASH="$$(cat /root/.npm/skv-deps.sha256 2>/dev/null || true)"

        echo "Current dependencies hash: $$CURRENT_HASH"
        echo "Cached dependencies hash:  $${CACHED_HASH:-none}"

        if [ "$$CURRENT_HASH" != "$$CACHED_HASH" ] || [ ! -x node_modules/.bin/astro ]; then

          echo "=== Dependencies changed or missing ==="
          echo "=== Running npm ci ==="

          npm ci \
            --prefer-offline \
            --no-audit \
            --no-fund \
            --update-notifier=false \
            --maxsockets=2 \
            --loglevel=info

          echo "$$CURRENT_HASH" > /root/.npm/skv-deps.sha256

          echo "=== Dependencies installed successfully ==="

        else

          echo "=== Dependencies unchanged; skipping npm ci ==="

        fi

        echo "=== Building Astro ==="

        npm run build

    networks:
      - skv

  web:
    image: skv-web:latest

    build:
      context: .
      dockerfile: deploy/web.Dockerfile

    container_name: skv-web
    restart: unless-stopped

    ports:
      - "4321:80"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1/ || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

    networks:
      - skv


volumes:
  postgres_data:
  astro_node_modules:
  astro_npm_cache:


networks:
  skv: